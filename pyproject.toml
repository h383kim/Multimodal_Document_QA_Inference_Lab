[project]
name = "multimodal-inference-lab"
version = "0.1.0"
description = "Benchmark and optimization platform for multimodal document QA inference."
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pillow>=10.0",
    "pymupdf>=1.23",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "psutil>=5.9",
    "structlog>=24.1",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.45",
    "accelerate>=0.30",
]
ui = [
    "streamlit>=1.36",
    "httpx>=0.27",
]
ocr = [
    "pytesseract>=0.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
    "types-psutil>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length is enforced by the formatter
    "B008",  # FastAPI uses Depends() in defaults by design
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[tool.mypy]
python_version = "3.10"
files = ["app", "ui", "scripts"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_optional = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["app.backends.*", "app.evals.*", "app.schemas.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true

[tool.coverage.run]
source = ["app", "ui"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
