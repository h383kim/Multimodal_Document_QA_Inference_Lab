[project]
name = "multimodal-inference-lab"
version = "0.1.0"
description = "Benchmark and optimization platform for multimodal document QA inference."
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pillow>=10.0",
    "pymupdf>=1.23",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "psutil>=5.9",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.45",
    "accelerate>=0.30",
]
ui = [
    "streamlit>=1.36",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
