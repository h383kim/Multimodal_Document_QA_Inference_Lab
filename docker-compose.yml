services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mmi-lab-api:latest
    ports:
      - "8000:8000"
    environment:
      MMI_DEFAULT_BACKEND: ${MMI_DEFAULT_BACKEND:-mock}
      MMI_LOG_LEVEL: ${MMI_LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data:ro
      - ./results:/app/results
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: mmi-lab-api:latest
    command:
      - streamlit
      - run
      - ui/streamlit_app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
    ports:
      - "8501:8501"
    environment:
      MMI_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
